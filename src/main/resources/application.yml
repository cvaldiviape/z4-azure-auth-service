server:
  port: 8081

spring:
  application:
    name: auth-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

app:
  security: # Reglas de acceso que aplica z4-shared-security.
    public-paths: /auth/**, /actuator/health # Sin token.
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-32-bytes}
    ttl: 3600
